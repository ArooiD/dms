########################################################################
server.port=8000
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${KC_HOST:infra.kcsql}:${KC_PORT:8080}/realms/dms/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${KC_HOST:infra.kcsql}:${KC_PORT:8080}/realms/dms
########################################################################
minio.endpoint=http://infra.minio:9000
minio.access-key=minio
minio.secret-key=minio123
minio.bucket=files-pool
########################################################################
spring.datasource.url=jdbc:postgresql://${DB_HOST:infra.psql}:${DB_PORT:5432}/dms
spring.datasource.username=${DB_USR:postgres}
spring.datasource.password=${DB_PWD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

