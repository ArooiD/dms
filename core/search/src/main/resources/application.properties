########################################################################
server.port=8000
server.servlet.context-path=/
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${KC_HOST:localhost}:${KC_PORT:8080}/realms/dms/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${KC_HOST:localhost}:${KC_PORT:8080}/realms/dms
########################################################################
spring.datasource.url=jdbc:postgresql://${DB_HOST:infra.psql}:${DB_PORT:5432}/dms
spring.datasource.username=${DB_USR:postgres}
spring.datasource.password=${DB_PWD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
########################################################################
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB